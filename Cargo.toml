[package]
edition = "2024"
name = "ckb-tui"
version = "0.1.2"
license = "MIT"

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.42"
ckb-jsonrpc-types = "^1"
# ckb-jsonrpc-types-new = {git = "https://github.com/nervosnetwork/ckb", branch = "zhangsoledad/tui", package = "ckb-jsonrpc-types"}
byteutils = "0.1.1"
ckb-fixed-hash-core = "1.0.0"
