cursive-async-view = "0.8.0"
cursive-spinner-view = "0.1.5"
cursive_table_view = "0.15.0"
http = "1.3.1"
log = "0.4.27"
number_prefix = "0.4.0"
numext-fixed-uint = "0.1"
